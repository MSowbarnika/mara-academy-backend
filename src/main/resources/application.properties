spring.application.name=mara-academy

server.port=${PORT:8080}

# Database (override with environment variables when deploying)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mara_academy?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Allowed frontend URLs, comma separated
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# First admin (created only when no admin exists yet)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Real passwords live in application-local.properties (git-ignored)
spring.config.import=optional:classpath:application-local.properties
